  <text x="600" y="282" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.32em" fill="#d8ae7c" opacity="0.9">
    OPTICAL DEPTH &amp; PARTICLE DUST GALLERY
