  </text>

  <!-- Pill Metadata Badges -->
  <g transform="translate(600, 362)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" letter-spacing="0.2em" fill="rgba(255,255,255,0.3)" text-transform="uppercase">
      SPECIMEN ARCHIVE <tspan fill="rgba(216,174,124,0.6)">●</tspan> VER. 1.0.0 PRODUCTION RELEASE
    </text>
  </g>
