<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f1c18" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0e0f13" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#08080a" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8ed"/>
      <stop offset="40%" stop-color="#ecd9b6"/>
      <stop offset="100%" stop-color="#b88f57"/>
    </linearGradient>
    <linearGradient id="nbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5dcaf"/>
      <stop offset="50%" stop-color="#dcb378"/>
      <stop offset="100%" stop-color="#a47a3e"/>
    </linearGradient>
    <linearGradient id="nbTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#eae2d2"/>
    </linearGradient>
    <linearGradient id="nbLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5ede0"/>
      <stop offset="100%" stop-color="#dbcea7"/>
    </linearGradient>
    <linearGradient id="nbDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="100%" stop-color="#090a0d"/>
    </linearGradient>
    <filter id="dustGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" fill="url(#bgGlow)"/>

  <!-- Border & Trim Marks -->
  <rect x="20" y="20" width="1160" height="380" fill="none" stroke="rgba(216,174,124,0.18)" stroke-width="1"/>
  <path d="M 12 32 L 32 32 L 32 12" fill="none" stroke="#dcb378" stroke-width="1.5" opacity="0.7"/>
  <path d="M 1188 32 L 1168 32 L 1168 12" fill="none" stroke="#dcb378" stroke-width="1.5" opacity="0.7"/>
  <path d="M 12 388 L 32 388 L 32 408" fill="none" stroke="#dcb378" stroke-width="1.5" opacity="0.7"/>
  <path d="M 1188 388 L 1168 388 L 1168 408" fill="none" stroke="#dcb378" stroke-width="1.5" opacity="0.7"/>

  <!-- Subtle Coordinate / Diagnostic Grid Lines -->
  <line x1="80" y1="210" x2="1120" y2="210" stroke="rgba(255,255,255,0.03)" stroke-dasharray="3 6"/>
  <line x1="600" y1="40" x2="600" y2="380" stroke="rgba(255,255,255,0.03)" stroke-dasharray="3 6"/>

  <!-- Brand Symbol / Isometric Prism (Scaled and Centered) -->
  <g transform="translate(536, 68) scale(2.0)">
    <polygon points="12,20 32,32 32,56 12,44" fill="url(#nbLeft)"/>
    <polygon points="12,20 32,32 12,44" fill="#ffffff" opacity="0.3"/>
    <polygon points="22,26 32,44 12,44" fill="#cfbfab" opacity="0.4"/>
    <polygon points="32,8 52,20 32,32 12,20" fill="url(#nbTop)"/>
    <polygon points="32,8 42,26 12,20" fill="#ffffff" opacity="0.45"/>
    <polygon points="32,8 52,20 42,26" fill="#ded3bf" opacity="0.5"/>
    <polygon points="32,32 52,20 52,44 32,56" fill="url(#nbDark)"/>
    <polygon points="32,32 42,40 32,56" fill="#141720" opacity="0.85"/>
    <line x1="32" y1="32" x2="52" y2="44" stroke="url(#nbGold)" stroke-width="1.2" opacity="0.6"/>
    <line x1="32" y1="56" x2="52" y2="32" stroke="url(#nbGold)" stroke-width="1.2" opacity="0.4"/>
    <polyline points="32,8 12,20 12,44 32,56 52,44" stroke="url(#nbGold)" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="32" y1="8" x2="44" y2="15.2" stroke="url(#nbGold)" stroke-width="1.8"/>
    <line x1="47" y1="17" x2="52" y2="20" stroke="url(#nbGold)" stroke-width="1.2" stroke-dasharray="1.5 1.5"/>
    <line x1="32" y1="32" x2="12" y2="20" stroke="url(#nbGold)" stroke-width="1.6"/>
    <line x1="32" y1="32" x2="32" y2="56" stroke="url(#nbGold)" stroke-width="1.6"/>
    <line x1="32" y1="32" x2="46" y2="23.6" stroke="url(#nbGold)" stroke-width="1.6"/>
    <line x1="48" y1="22.4" x2="52" y2="20" stroke="url(#nbGold)" stroke-width="1.2" stroke-dasharray="1.5 1.5"/>
    <line x1="12" y1="20" x2="32" y2="44" stroke="url(#nbGold)" stroke-width="1.2" opacity="0.75"/>
    <line x1="22" y1="26" x2="12" y2="44" stroke="url(#nbGold)" stroke-width="1.2" opacity="0.75"/>
    <line x1="32" y1="8" x2="32" y2="32" stroke="url(#nbGold)" stroke-width="1.2" opacity="0.75"/>
    <line x1="12" y1="20" x2="52" y2="20" stroke="url(#nbGold)" stroke-width="1.2" opacity="0.6"/>
    
    <!-- Dissolving Quantum Grains -->
    <g filter="url(#dustGlow)">
      <circle cx="50" cy="12" r="1.5" fill="#fdfaf3"/>
      <circle cx="50" cy="12" r="2.8" fill="#dcb378" opacity="0.4"/>
      <circle cx="56" cy="16" r="1.3" fill="#fdfaf3"/>
      <circle cx="56" cy="16" r="2.5" fill="#dcb378" opacity="0.35"/>
      <circle cx="53" cy="22" r="1.4" fill="#ffe2b0"/>
      <circle cx="59" cy="24" r="1.1" fill="#fdfaf3"/>
      <circle cx="57" cy="29" r="1.2" fill="#dcb378"/>
      <circle cx="61" cy="19" r="0.9" fill="#fdfaf3"/>
      <circle cx="54" cy="8" r="1.0" fill="#ffe9c4"/>
      <circle cx="48" cy="6" r="0.8" fill="#dcb378"/>
      <circle cx="60" cy="13" r="0.8" fill="#fdfaf3"/>
      <circle cx="55" cy="35" r="0.9" fill="#dcb378"/>
      <circle cx="58" cy="38" r="0.7" fill="#ffe2b0"/>
      <circle cx="62" cy="28" r="0.7" fill="#fdfaf3"/>
      <circle cx="46" cy="10" r="0.6" fill="#dcb378" opacity="0.8"/>
      <circle cx="51" cy="17" r="0.6" fill="#fff" opacity="0.9"/>
      <circle cx="48" cy="21" r="0.5" fill="#dcb378" opacity="0.7"/>
      <circle cx="54" cy="26" r="0.6" fill="#fff" opacity="0.8"/>
      <circle cx="56" cy="11" r="0.5" fill="#dcb378" opacity="0.6"/>
      <circle cx="59" cy="10" r="0.5" fill="#ffe2b0" opacity="0.7"/>
      <circle cx="63" cy="17" r="0.5" fill="#dcb378" opacity="0.5"/>
      <circle cx="52" cy="31" r="0.5" fill="#dcb378" opacity="0.6"/>
      <circle cx="56" cy="33" r="0.5" fill="#fff" opacity="0.7"/>
    </g>
  </g>

  <!-- Ambient Ambient Particles -->
  <g opacity="0.6" filter="url(#dustGlow)">
    <circle cx="360" cy="130" r="1.2" fill="#dcb378"/>
    <circle cx="410" cy="90" r="0.8" fill="#ffe9c4"/>
    <circle cx="480" cy="150" r="1.5" fill="#fdfaf3"/>
    <circle cx="720" cy="100" r="1.0" fill="#dcb378"/>
    <circle cx="780" cy="160" r="1.3" fill="#ffe2b0"/>
    <circle cx="830" cy="120" r="0.9" fill="#fdfaf3"/>
  </g>

  <!-- Typography -->
  <text x="600" y="248" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="300" letter-spacing="0.18em" fill="url(#goldText)">
    NANOBIT
