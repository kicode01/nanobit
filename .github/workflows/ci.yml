name: CI Integrity & Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Core Deliverables
        run: |
          test -f index.html || (echo "Missing index.html" && exit 1)
          test -f package.json || (echo "Missing package.json" && exit 1)
          test -f LICENSE || (echo "Missing LICENSE" && exit 1)
          test -f README.md || (echo "Missing README.md" && exit 1)
          test -f assets/icon.svg || (echo "Missing assets/icon.svg" && exit 1)
          test -f assets/banner.svg || (echo "Missing assets/banner.svg" && exit 1)
          echo "All critical production artifacts verified."

      - name: Validate JSON Schema & Syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'));"
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'));"
          echo "JSON files validated successfully."
